<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحليل الفروقات</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 16px 90px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 14px 0;
    }

    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 11px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #64748b;
      background: #0f172a;
      color: #ffffff;
      display: block;
    }

    button.action-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      margin-top: 6px;
    }

    .result {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #475569;
      font-size: 14px;
      line-height: 1.7;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px;
      gap: 4px;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-item.active {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>تحليل الفروقات</h1>

  <!-- 1. المواد -->
  <div id="p-mat" class="page active">
    <div class="box">
      <div class="field">
        <label>الكمية الفعلية (AQ)</label>
        <input type="text" inputmode="decimal" id="aq" placeholder="مثال: 1200" />
      </div>
      <div class="field">
        <label>الكمية المعيارية (SQ)</label>
        <input type="text" inputmode="decimal" id="sq" placeholder="مثال: 1000" />
      </div>
      <div class="field">
        <label>السعر الفعلي (AP)</label>
        <input type="text" inputmode="decimal" id="ap" placeholder="مثال: 55" />
      </div>
      <div class="field">
        <label>السعر المعياري (SP)</label>
        <input type="text" inputmode="decimal" id="sp" placeholder="مثال: 50" />
      </div>
      <button class="action-btn" onclick="calcMat()">احسب فروقات المواد</button>
      <div id="resMat" class="result">أدخلي الأرقام ثم اضغطي على زر الحساب.</div>
    </div>
  </div>

  <!-- 2. اليد العاملة -->
  <div id="p-lab" class="page">
    <div class="box">
      <div class="field">
        <label>الساعات الفعلية (AH)</label>
        <input type="text" inputmode="decimal" id="ah" placeholder="مثال: 420" />
      </div>
      <div class="field">
        <label>الساعات المعيارية (SH)</label>
        <input type="text" inputmode="decimal" id="sh" placeholder="مثال: 400" />
      </div>
      <div class="field">
        <label>الأجر الفعلي للساعة (AR)</label>
        <input type="text" inputmode="decimal" id="ar" placeholder="مثال: 320" />
      </div>
      <div class="field">
        <label>الأجر المعياري للساعة (SR)</label>
        <input type="text" inputmode="decimal" id="sr" placeholder="مثال: 300" />
      </div>
      <button class="action-btn" onclick="calcLab()">احسب فروقات اليد العاملة</button>
      <div id="resLab" class="result">أدخلي الأرقام ثم اضغطي على زر الحساب.</div>
    </div>
  </div>

  <!-- 3. المساعد -->
  <div id="p-ai" class="page">
    <div class="box">
      <div class="field">
        <label>اكتبي سؤالك هنا</label>
        <input type="text" id="qInput" placeholder="مثال: ما الفرق بين F و U؟" />
      </div>
      <button class="action-btn" onclick="answerQ()">إجابة</button>
      <div id="resAI" class="result">اسألي عن الفروقات أو القوانين.</div>
    </div>
  </div>

  <!-- 4. السجل -->
  <div id="p-hist" class="page">
    <div class="box">
      <div id="resHist" class="result">لا توجد عمليات محفوظة بعد.</div>
      <button class="action-btn" onclick="clearHist()">مسح السجل</button>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="nav-item active" onclick="openPage('p-mat', this)">المواد</button>
    <button class="nav-item" onclick="openPage('p-lab', this)">اليد العاملة</button>
    <button class="nav-item" onclick="openPage('p-ai', this)">المساعد</button>
    <button class="nav-item" onclick="openPage('p-hist', this)">السجل</button>
  </div>

  <script>
    let hist = JSON.parse(localStorage.getItem('simple_va_hist') || '[]');

    function openPage(id, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showHist();
    }

    function num(id) {
      const val = document.getElementById(id).value.replace(',', '.');
      return parseFloat(val) || 0;
    }

    function saveItem(text) {
      hist.unshift(text);
      hist = hist.slice(0, 20);
      localStorage.setItem('simple_va_hist', JSON.stringify(hist));
      showHist();
    }

    function showHist() {
      const box = document.getElementById('resHist');
      box.innerHTML = hist.length ? hist.map(x => '• ' + x).join('<br>') : 'لا توجد عمليات محفوظة بعد.';
    }

    function clearHist() {
      hist = [];
      localStorage.removeItem('simple_va_hist');
      showHist();
    }

    function calcMat() {
      const aq = num('aq'), sq = num('sq'), ap = num('ap'), sp = num('sp');
      const pv = (ap - sp) * aq;
      const qv = (aq - sq) * sp;
      const tv = (ap * aq) - (sp * sq);
      const msg = `انحراف السعر: ${pv.toFixed(2)} | انحراف الكمية: ${qv.toFixed(2)} | الإجمالي: ${tv.toFixed(2)}`;
      document.getElementById('resMat').innerHTML = msg;
      saveItem('مواد: ' + msg);
    }

    function calcLab() {
      const ah = num('ah'), sh = num('sh'), ar = num('ar'), sr = num('sr');
      const rv = (ar - sr) * ah;
      const ev = (ah - sh) * sr;
      const tv = (ar * ah) - (sr * sh);
      const msg = `انحراف المعدل: ${rv.toFixed(2)} | انحراف الكفاءة: ${ev.toFixed(2)} | الإجمالي: ${tv.toFixed(2)}`;
      document.getElementById('resLab').innerHTML = msg;
      saveItem('يد عاملة: ' + msg);
    }

    function answerQ() {
      const q = document.getElementById('qInput').value.trim();
      const box = document.getElementById('resAI');
      if (!q) {
        box.innerHTML = 'اكتبي سؤالك أولاً.';
        return;
      }
      if (q.includes('F') || q.includes('U') || q.includes('ملائم')) {
        box.innerHTML = 'F (ملائم): أفضل من المعيار. U (غير ملائم): أسوأ من المعيار.';
      } else {
        box.innerHTML = 'قانون السعر/المعدل = (الفعلي - المعياري) × الفعلي. قانون الكمية/الكفاءة = (الفعلي - المعياري) × المعياري.';
      }
    }

    showHist();
  </script>
</body>
</html>
