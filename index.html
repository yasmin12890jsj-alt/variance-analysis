<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#140b29" />
  <title>تحليل الفروقات</title>
  <style>
    :root {
      --bg: #120926;
      --bg-grad: radial-gradient(circle at 85% 0%, #2d1666 0%, #190d36 48%, #100822 100%);
      --card: #1d103d;
      --card-2: #271552;
      --card-3: #331c6b;
      --line: rgba(196, 181, 253, 0.16);
      --line-strong: rgba(196, 181, 253, 0.32);
      --text: #f8f5ff;
      --muted: #b8a9e0;
      --violet: #8b5cf6;
      --violet-bright: #a78bfa;
      --violet-deep: #5b21b6;
      --fav: #34d399;
      --defav: #fb7185;
      --warn: #fbbf24;
      --radius: 18px;
      --radius-sm: 12px;
      --nav-h: 70px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-grad);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Kufi Arabic", sans-serif;
    }

    /* 1. Intro Screen */
    #introScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 45%, #3b1d82 0%, #170b33 65%, #0c051c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }

    .intro-orb {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.35), rgba(91, 33, 182, 0.05) 70%);
      animation: pulseOrb 2.6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseOrb {
      0% { transform: scale(0.85); opacity: 0.65; }
      100% { transform: scale(1.22); opacity: 1; }
    }

    .intro-logo {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--violet-deep), var(--violet-bright));
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 20px 45px rgba(139, 92, 246, 0.5);
      margin-bottom: 18px;
      animation: logoZoom 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes logoZoom {
      0% { opacity: 0; transform: scale(0.55) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .intro-title {
      position: relative;
      font-size: 28px;
      font-weight: 900;
      margin: 0 0 8px 0;
      opacity: 0;
      animation: textReveal 0.85s ease 0.3s forwards;
    }

    .intro-tag {
      position: relative;
      font-size: 13.5px;
      color: var(--muted);
      margin: 0 0 24px 0;
      opacity: 0;
      animation: textReveal 0.85s ease 0.6s forwards;
    }

    @keyframes textReveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .intro-skip {
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 2. Login Screen */
    #loginScreen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(39, 21, 82, 0.94), rgba(29, 16, 61, 0.98));
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(7, 3, 18, 0.6);
    }

    .login-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* 3. Main App */
    #mainApp {
      display: none;
      padding-bottom: calc(var(--nav-h) + 24px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(18, 9, 38, 0.88);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-icon {
      width: 35px;
      height: 35px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--violet-deep), var(--violet-bright));
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
    }

    .brand h1 {
      font-size: 14.5px;
      margin: 0;
      font-weight: 800;
    }

    .brand small {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    select, input {
      font-family: inherit;
    }

    .sel {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 700;
      outline: none;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subtabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .subtabs::-webkit-scrollbar { display: none; }

    .subtab {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .subtab.active {
      background: linear-gradient(135deg, var(--violet-deep), var(--violet));
      color: #fff;
      border-color: transparent;
    }

    .card {
      background: linear-gradient(180deg, rgba(39, 21, 82, 0.9), rgba(29, 16, 61, 0.96));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 12px 28px rgba(8, 3, 20, 0.45);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      margin: 0;
    }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.16);
      color: var(--violet-bright);
      border: 1px solid rgba(167, 139, 250, 0.28);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    .kpi-lbl { font-size: 11.5px; color: var(--muted); font-weight: 700; }
    .kpi-val { font-size: 19px; font-weight: 900; margin: 4px 0; }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    .fav { color: var(--fav); }
    .defav { color: var(--defav); }
    .vtext { color: var(--violet-bright); }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    @media (max-width: 620px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong);
      background: #100822;
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--violet-bright);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--violet-deep), var(--violet));
      color: #fff;
      flex: 1;
      min-width: 140px;
    }

    .btn-sec {
      background: var(--card-3);
      color: var(--text);
      border: 1px solid var(--line-strong);
    }

    .btn-del {
      background: rgba(251, 113, 133, 0.16);
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.35);
      padding: 6px 10px;
      font-size: 11.5px;
    }

    .res-box {
      margin-top: 13px;
      background: #100822;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: 13px;
      line-height: 1.7;
    }

    .diag-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(139, 92, 246, 0.12);
      border-right: 3px solid var(--violet-bright);
    }

    .chart-row { margin-bottom: 12px; }
    .chart-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 5px;
      color: var(--muted);
    }

    .bar-track {
      height: 11px;
      border-radius: 999px;
      background: #100822;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet), var(--violet-bright));
      transition: width 0.35s ease;
    }

    .bar-fill.fav-bg {
      background: linear-gradient(90deg, #059669, var(--fav));
    }

    .rec-card {
      background: #100822;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 9px
