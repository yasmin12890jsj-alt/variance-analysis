<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b132b" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b132b'/%3E%3Cpath d='M14 42L26 28L36 35L50 18' stroke='%2310b981' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='50' cy='18' r='5' fill='%23f59e0b'/%3E%3C/svg%3E" />
  <title>الموسوعة الشاملة لتحليل الفروقات والميزانية + مساعد ذكي</title>
  <style>
    :root {
      --bg: #070d19;
      --panel: #0f172a;
      --panel-2: #162033;
      --panel-3: #1e293b;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.14);
      --rose: #f43f5e;
      --rose-bg: rgba(244, 63, 94, 0.14);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.14);
      --sky: #38bdf8;
      --sky-bg: rgba(56, 189, 248, 0.14);
      --violet: #a78bfa;
      --violet-bg: rgba(167, 139, 250, 0.14);
      --r: 18px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgba(16, 185, 129, 0.12), transparent 36%),
        radial-gradient(circle at 88% 8%, rgba(167, 139, 250, 0.12), transparent 36%),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 64px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(14px);
      background: rgba(7, 13, 25, 0.88);
      border-bottom: 1px solid var(--line);
      padding: 13px 16px;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(167, 139, 250, 0.2));
      border: 1px solid rgba(167, 139, 250, 0.35);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
    }

    .brand p {
      margin: 1px 0 0;
      font-size: 0.77rem;
      color: var(--muted);
    }

    .selectors {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    select, input, button, textarea {
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 0.92rem;
      outline: none;
    }

    select {
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .wrap {
      max-width: 1120px;
      margin: 18px auto 0;
      padding: 0 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--sky);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      color: var(--text);
    }

    .field input:focus, .field select:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .nav-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .pill-btn {
      background: var(--panel-2);
      color: #cbd5e1;
      border: 1px solid var(--line);
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.84rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .pill-btn.active {
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      color: #05111a;
      border-color: transparent;
    }

    .pill-btn[data-sec="ai"].active {
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      color: #080b16;
    }

    .btn-run {
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      color: #05111a;
      border: none;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      flex: 1;
      min-width: 210px;
    }

    .btn-ghost {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 11px 14px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .hero-result {
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .hero-result.fav {
      background: var(--emerald-bg);
      border-color: rgba(16, 185, 129, 0.45);
    }

    .hero-result.unfav {
      background: var(--rose-bg);
      border-color: rgba(244, 63, 94, 0.45);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 14px;
    }

    .stat-name {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-num {
      font-size: 1.24rem;
      font-weight: 800;
      margin: 5px 0 8px;
    }

    .bar-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .tag-fav {
      background: var(--emerald-bg);
      color: #6ee7b7;
    }

    .tag-unfav {
      background: var(--rose-bg);
      color: #fda4af;
    }

    .tag-zero {
      background: var(--sky-bg);
      color: #7dd3fc;
    }

    .tag-ai {
      background: var(--violet-bg);
      color: #ddd6fe;
    }

    .alert-box {
      background: var(--amber-bg);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 0.88rem;
    }

    .alert-box strong {
      display: block;
      color: #fbbf24;
      margin-bottom: 2px;
    }

    .history-item, .guide-box {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.88rem;
    }

    .history-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* واجهة الذكاء الاصطناعي الداخلي */
    .chat-box {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .msg {
      padding: 11px 14px;
      border-radius: 14px;
      max-width: 90%;
      font-size: 0.9rem;
      white-space: pre-line;
    }

    .msg-ai {
      background: var(--violet-bg);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #f3e8ff;
      align-self: flex-start;
    }

    .msg-user {
      background: var(--sky-bg);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e0f2fe;
      align-self: flex-end;
    }

    .quick-qs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-chip {
      background: var(--panel-3);
      color: #e2e8f0;
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chat-form input {
      flex: 1;
      min-width: 200px;
      padding: 11px 13px;
      background: var(--panel-2);
      color: var(--text);
    }

    .btn-ai {
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      color: #070d19;
      border: none;
      padding: 11px 18px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 64 64" fill="none">
            <path d="M14 42L26 28L36 35L50 18" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="18" r="5" fill="#a78bfa"/>
          </svg>
        </div>
        <div>
          <h1 id="t_title">الموسوعة الشاملة لتحليل الفروقات والميزانية</h1>
          <p id="t_sub">مواد • يد عاملة • أعباء ثابتة ومتغيرة • مبيعات • ميزانية مرنة • ذكاء اصطناعي</p>
        </div>
      </div>

      <div class="selectors">
        <select id="langSel" aria-label="Language">
          <option value="ar">العربية (AR)</option>
          <option value="fr">Français (FR)</option>
          <option value="en">English (EN)</option>
        </select>
        <select id="curSel" aria-label="Currency">
          <option value="DZD">DZD (د.ج)</option>
          <option value="EUR">EUR (€)</option>
          <option value="USD">USD ($)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- الإعدادات العامة والعملة -->
    <section class="panel">
      <div class="panel-title">
        <span id="t_cfgTitle">الإعدادات العامة والعملة</span>
        <span class="tag tag-ai" id="t_cfgBadge">AI + DZD/EUR/USD</span>
      </div>
      <div class="grid-4">
        <div class="field">
          <label id="t_baseCurLbl" for="baseCur">عملة الإدخال</label>
          <select id="baseCur">
            <option value="DZD">DZD</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <div class="field">
          <label id="t_rateLbl" for="fxRate">سعر التحويل لعملة العرض</label>
          <input type="number" id="fxRate" step="any" value="1" min="0.000001" />
          <div class="hint" id="t_rateHint">مثال: 145 لتحويل EUR إلى DZD</div>
        </div>
        <div class="field">
          <label id="t_natureLbl" for="natureSel">طبيعة العنصر</label>
          <select id="natureSel">
            <option value="cost">تكلفة / أعباء (Cost)</option>
            <option value="revenue">إيراد / مبيعات (Revenue)</option>
          </select>
        </div>
        <div class="field">
          <label id="t_jointRuleLbl" for="jointRule">معالجة التداخل (Joint)</label>
          <select id="jointRule">
            <option value="isolate">عزل الفارق المشترك</option>
            <option value="std_base">قاعدة المعيار الأساسي</option>
          </select>
        </div>
      </div>
    </section>

    <!-- أقسام التطبيق الشاملة -->
    <section class="panel">
      <div class="nav-pills">
        <button class="pill-btn active" data-sec="mat" id="t_tabMat">المواد والشراء</button>
        <button class="pill-btn" data-sec="lab" id="t_tabLab">اليد العاملة</button>
        <button class="pill-btn" data-sec="ovh" id="t_tabOvh">الأعباء (ثابتة/متغيرة)</button>
        <button class="pill-btn" data-sec="sls" id="t_tabSls">المبيعات والإيرادات</button>
        <button class="pill-btn" data-sec="bud" id="t_tabBud">الميزانية المرنة</button>
        <button class="pill-btn" data-sec="ai" id="t_tabAi">المساعد الذكي (AI)</button>
        <button class="pill-btn" data-sec="fixes" id="t_tabFixes">المشاكل والحلول</button>
        <button class="pill-btn" data-sec="hist" id="t_tabHist">السجل</button>
      </div>

      <!-- 1. المواد الأولية والشراء -->
      <div id="sec-mat" class="sec-box">
        <div class="grid-4">
          <div class="field">
            <label id="t_mqAct">الكمية المستهلكة الفعلية</label>
            <input type="number" id="mqAct" step="any" value="120" />
          </div>
          <div class="field">
            <label id="t_mqStd">الكمية المعيارية المقررة</label>
            <input type="number" id="mqStd" step="any" value="100" />
          </div>
          <div class="field">
            <label id="t_mpAct">السعر الفعلي للوحدة</label>
            <input type="number" id="mpAct" step="any" value="550" />
          </div>
          <div class="field">
            <label id="t_mpStd">السعر المعياري للوحدة</label>
            <input type="number" id="mpStd" step="any" value="500" />
          </div>
        </div>
        <div class="field" style="margin-top:12px;">
          <label id="t_mqPur">الكمية المشتراة (اختياري - الشراء مقابل الاستهلاك)</label>
          <input type="number" id="mqPur" step="any" placeholder="مثال: 150" />
        </div>
        <div class="btn-row">
          <button class="btn-run" id="runMat">تحليل فروقات المواد والشراء</button>
          <button class="btn-ghost" type="button" id="exMat">مثال جاهز</button>
        </div>
      </div>

      <!-- 2. اليد العاملة -->
      <div id="sec-lab" class="sec-box" style="display:none;">
        <div class="grid-4">
          <div class="field">
            <label id="t_lhAct">الساعات الفعلية</label>
            <input type="number" id="lhAct" step="any" value="90" />
          </div>
          <div class="field">
            <label id="t_lhStd">الساعات المعيارية</label>
            <input type="number" id="lhStd" step="any" value="80" />
          </div>
          <div class="field">
            <label id="t_lrAct">معدل الأجر الفعلي</label>
            <input type="number" id="lrAct" step="any" value="1300" />
          </div>
          <div class="field">
            <label id="t_lrStd">معدل الأجر المعياري</label>
            <input type="number" id="lrStd" step="any" value="1250" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-run" id="runLab">تحليل فروقات اليد العاملة</button>
          <button class="btn-ghost" type="button" id="exLab">مثال جاهز</button>
        </div>
      </div>

      <!-- 3. الأعباء غير المباشرة الثابتة والمتغيرة -->
      <div id="sec-ovh" class="sec-box" style="display:none;">
        <div class="grid-4">
          <div class="field">
            <label id="t_ovVarAct">أعباء متغيرة فعلية</label>
            <input type="number" id="ovVarAct" step="any" value="88000" />
          </div>
          <div class="field">
            <label id="t_ovVarBud">أعباء متغيرة معيارية (للنشاط الفعلي)</label>
            <input type="number" id="ovVarBud" step="any" value="80000" />
          </div>
          <div class="field">
            <label id="t_ovFixAct">أعباء ثابتة فعلية</label>
            <input type="number" id="ovFixAct" step="any" value="125000" />
          </div>
          <div class="field">
            <label id="t_ovFixBud">أعباء ثابتة مخططة / ممتصة</label>
            <input type="number" id="ovFixBud" step="any" value="120000" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-run" id="runOvh">تحليل الأعباء الثابتة والمتغيرة</button>
          <button class="btn-ghost" type="button" id="exOvh">مثال جاهز</button>
        </div>
      </div>

      <!-- 4. المبيعات والإيرادات -->
      <div id="sec-sls" class="sec-box" style="display:none;">
        <div class="grid-4">
          <div class="field">
            <label id="t_sqAct">الكمية المباعة الفعلية</label>
            <input type="number" id="sqAct" step="any" value="540" />
          </div>
          <div class="field">
            <label id="t_sqBud">الكمية المباعة المخططة</label>
            <input type="number" id="sqBud" step="any" value="500" />
          </div>
          <div class="field">
            <label id="t_spAct">سعر البيع الفعلي للوحدة</label>
            <input type="number" id="spAct" step="any" value="1950" />
          </div>
          <div class="field">
            <label id="t_spBud">سعر البيع المخطط للوحدة</label>
            <input type="number" id="spBud" step="any" value="2000" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-run" id="runSls">تحليل فروقات المبيعات والإيرادات</button>
          <button class="btn-ghost" type="button" id="exSls">مثال جاهز</button>
        </div>
      </div>

      <!-- 5. الميزانية المرنة والثابتة -->
      <div id="sec-bud" class="sec-box" style="display:none;">
        <div class="grid-4">
          <div class="field">
            <label id="t_bAct">الإنفاق / القيمة الفعلية</label>
            <input type="number" id="bAct" step="any" value="260000" />
          </div>
          <div class="field">
            <label id="t_bFixed">الميزانية الثابتة / المخططة</label>
            <input type="number" id="bFixed" step="any" value="200000" />
          </div>
          <div class="field">
            <label id="t_bActLvl">النشاط الفعلي (وحدات / ساعات)</label>
            <input type="number" id="bActLvl" step="any" value="120" />
          </div>
          <div class="field">
            <label id="t_bPlanLvl">النشاط المخطط (وحدات / ساعات)</label>
            <input type="number" id="bPlanLvl" step="any" value="100" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-run" id="runBud">تحليل الميزانية المرنة والنشاط</button>
          <button class="btn-ghost" type="button" id="exBud">مثال جاهز</button>
        </div>
      </div>

      <!-- 6. المساعد الذكي الداخلي (AI) -->
      <div id="sec-ai" class="sec-box" style="display:none;">
        <div class="quick-qs" id="quickQuestions"></div>
        <div class="chat-box" id="chatBox"></div>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" placeholder="اسألني عن أي فارق، ميزانية، تداخل، عملة، أو مشكلة محاسبية..." />
          <button class="btn-ai" type="submit" id="sendAiBtn">اسأل الذكاء الاصطناعي</button>
        </form>
      </div>

      <!-- 7. المشاكل والحلول -->
      <div id="sec-fixes" class="sec-box" style="display:none;">
        <div id="fixesContainer"></div>
      </div>

      <!-- 8. السجل -->
      <div id="sec-hist" class="sec-box" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <span style="font-weight:700;color:var(--muted);" id="t_histInfo">العمليات المحفوظة في هذا الجهاز</span>
          <button class="btn-ghost" type="button" id="clearHist">مسح السجل</button>
        </div>

    function generateAiReply(q) {
      const ql = q.toLowerCase();
      const cur = document.getElementById("curSel").value;
      const rate = parseFloat(document.getElementById("fxRate").value) || 1;
      const nature = document.getElementById("natureSel").value;

      if (lang === "ar") {
        if (ql.includes("تداخل") || ql.includes("مشترك") || ql.includes("joint")) {
          return "مشكلة التداخل (ΔP × ΔQ) تظهر عندما يتغير السعر والكمية معاً في نفس الفترة.\n• الحل العملي: عزل الفارق المشترك لإظهار أثر التغير المتزامن بوضوح، أو اعتماد قاعدة موحدة (مثل المعيار الأساسي) وتوضيح ذلك في التقرير المحاسبي.";
        }
        if (ql.includes("مرنة") || ql.includes("ثابتة") || ql.includes("ميزانية")) {
          return "الميزانية الثابتة تُبنى على مستوى نشاط مخطط واحد، بينما الميزانية المرنة تُحدّث حسب مستوى النشاط الفعلي.\n• القاعدة: لا تحكم على الأداء بمقارنة إنفاق نشاط 120 وحدة بميزانية 100 وحدة مباشرة؛ عدّل الميزانية أولاً لفصل فارق الحجم عن فارق الإنفاق.";
        }
        if (ql.includes("شراء") || ql.includes("استهلاك") || ql.includes("purchase")) {
          return "الكمية المشتراة غالباً لا تساوي الكمية المستهلكة في الإنتاج خلال الفترة نفسها.\n• الحل: نحسب فارق السعر عند لحظة الشراء (على الكمية المشتراة) لتقييم المشتريات، ونحسب فارق الكمية على الكمية المستهلكة لتقييم كفاءة الإنتاج.";
        }
        if (ql.includes("عملة") || ql.includes("صرف") || ql.includes("eur") || ql.includes("usd") || ql.includes("dzd")) {
          return `الإعداد الحالي للعرض هو (${cur}) بمعامل تحويل (${rate}) وطبيعة عنصر (${nature === "cost" ? "تكلفة" : "إيراد"}).\n• عند التعامل مع DZD و EUR و USD: افصل فارق السعر بالعملة الأصلية عن أثر تغير سعر الصرف حتى لا يختلط قرار التسعير مع حركة السوق النقدي.`;
        }
        if (ql.includes("ملائم") || ql.includes("غير ملائم") || ql.includes("favorable")) {
          return "• في التكاليف والأعباء: الفعلي أقل من المعياري/الميزانية = ملائم (Favorable) لأن التكلفة انخفضت، والفعلي أعلى = غير ملائم (Unfavorable).\n• في الإيرادات والمبيعات: الفعلي أعلى من المخطط = ملائم (Favorable) لأن الإيراد زاد، والفعلي أقل = غير ملائم (Unfavorable).";
        }
        return `بناءً على إعداداتكِ الحالية (${cur} | معامل ${rate})، يمكنني مساعدتكِ في تفسير أي فارق (مواد، يد عاملة، أعباء ثابتة/متغيرة، مبيعات، أو ميزانية مرنة) وتشخيص أسبابه المحاسبية خطوة بخطوة.`;
      }

      if (lang === "fr") {
        if (ql.includes("conjoint") || ql.includes("joint")) {
          return "L'écart conjoint (ΔP × ΔQ) apparaît lorsque le prix et la quantité varient simultanément.\n• Solution : isolez l'effet conjoint ou appliquez une convention constante et documentée.";
        }
        if (ql.includes("flexible") || ql.includes("budget")) {
          return "Le budget flexible s'ajuste au niveau d'activité réel afin de séparer l'écart de volume/activité de l'écart de dépenses ou de rendement.";
        }
        if (ql.includes("achat") || ql.includes("consommation")) {
          return "Séparez l'écart de prix sur quantités achetées de l'écart de quantité sur quantités consommées pour évaluer distinctement achats et production.";
        }
        if (ql.includes("change") || ql.includes("eur") || ql.includes("usd") || ql.includes("dzd")) {
          return `Devise d'affichage actuelle : ${cur} (taux : ${rate}). Isolez l'effet de change de la performance opérationnelle.`;
        }
        return `Je peux vous aider à interpréter vos écarts (matières, main-d'œuvre, charges fixes/variables, ventes, budget flexible) en ${cur}.`;
      }

      if (ql.includes("joint")) {
        return "Joint variance (ΔP × ΔQ) happens when price and quantity shift together.\n• Fix: isolate the mixed component or follow a consistent standard convention.";
      }
      if (ql.includes("flexible") || ql.includes("budget")) {
        return "A flexible budget adjusts to actual activity so volume/activity effects are separated from spending or efficiency variances.";
      }
      if (ql.includes("purchase") || ql.includes("usage")) {
        return "Measure price variance on purchased units and usage variance on consumed units to evaluate purchasing and production separately.";
      }
      if (ql.includes("fx") || ql.includes("currency") || ql.includes("eur") || ql.includes("usd") || ql.includes("dzd")) {
        return `Active display currency: ${cur} (rate: ${rate}). Separate currency exchange movements from operational variances.`;
      }
      return `I can help interpret your variances across materials, labor, fixed/variable overhead, sales, and flexible budgets in ${cur}.`;
    }

    function handleAiQuestion(text) {
      const clean = (text || "").trim();
      if (!clean) return;
      chatMessages.push({ role: "user", text: clean });
      chatMessages.push({ role: "ai", text: generateAiReply(clean) });
      renderChat();
      document.getElementById("chatInput").value = "";
    }

    function classify(val, nature) {
      const t = TXT[lang];
      if (Math.abs(val) < 1e-9) return { txt: t.zero, cls: "tag-zero", hero: "", bar: "#38bdf8" };
      const fav = nature === "cost" ? val < 0 : val > 0;
      return fav
        ? { txt: t.fav, cls: "tag-fav", hero: "fav", bar: "#10b981" }
        : { txt: t.unfav, cls: "tag-unfav", hero: "unfav", bar: "#f43f5e" };
    }

    function fmt(num) {
      const rate = parseFloat(document.getElementById("fxRate").value) || 1;
      const cur = document.getElementById("curSel").value;
      const v = num * rate;
      return `${new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v)} ${cur}`;
    }

    function saveHistory(label, totalVal, nature) {
      const item = {
        id: Date.now(),
        label,
        totalStr: fmt(totalVal),
        cls: classify(totalVal, nature).cls,
        badge: classify(totalVal, nature).txt
      };
      historyItems.unshift(item);
      historyItems = historyItems.slice(0, 15);
      localStorage.setItem("va_history_v3", JSON.stringify(historyItems));
      renderHistory();
    }

    function renderHistory() {
      const t = TXT[lang];
      const box = document.getElementById("historyList");
      if (!historyItems.length) {
        box.innerHTML = `<div class="hint">${t.noHist}</div>`;
        return;
      }
      box.innerHTML = historyItems.map(h => `
        <div class="history-item">
          <strong>${h.label}</strong>
          <div>
            <span style="margin-inline-end:8px;font-weight:800;">${h.totalStr}</span>
            <span class="tag ${h.cls}">${h.badge}</span>
          </div>
        </div>
      `).join("");
    }

    function paintResults(title, totalVal, cards, alerts, nature, record) {
      const hero = document.getElementById("heroBox");
      const hMeta = classify(totalVal, nature);
      hero.className = `hero-result ${hMeta.hero}`;
      hero.innerHTML = `
        <div>
          <div class="stat-name">${title}</div>
          <div style="font-size:1.35rem;font-weight:800;">${fmt(totalVal)}</div>
        </div>
        <span class="tag ${hMeta.cls}">${hMeta.txt}</span>
      `;

      const maxAbs = Math.max(...cards.map(c => Math.abs(c.val)), 1);
      document.getElementById("cardsGrid").innerHTML = cards.map(c => {
        const m = classify(c.val, nature);
        const pct = Math.min(100, Math.round((Math.abs(c.val) / maxAbs) * 100));
        return `
          <div class="stat-card">
            <div class="stat-name">${c.label}</div>
            <div class="stat-num">${fmt(c.val)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${m.bar};"></div></div>
            <span class="tag ${m.cls}">${m.txt}</span>
          </div>
        `;
      }).join("");

      document.getElementById("alertsArea").innerHTML = alerts.map(a => `
        <div class="alert-box"><strong>!</strong>${a}</div>
      `).join("");

      if (record) saveHistory(title, totalVal, nature);
    }

    function addFxAlert(alerts) {
      const b = document.getElementById("baseCur").value;
      const d = document.getElementById("curSel").value;
      const r = parseFloat(document.getElementById("fxRate").value) || 1;
      if (b !== d || r !== 1) alerts.push(TXT[lang].aFx);
    }

    function calcMat(record = true) {
      const t = TXT[lang];
      const nature = document.getElementById("natureSel").value;
      const rule = document.getElementById("jointRule").value;
      const qa = parseFloat(document.getElementById("mqAct").value) || 0;
      const qs = parseFloat(document.getElementById("mqStd").value) || 0;
      const pa = parseFloat(document.getElementById("mpAct").value) || 0;
      const ps = parseFloat(document.getElementById("mpStd").value) || 0;
      const purRaw = document.getElementById("mqPur").value;
      const qPur = purRaw !== "" ? parseFloat(purRaw) : qa;

      const total = (qa * pa) - (qs * ps);
      const joint = (pa - ps) * (qa - qs);
      const priceVar = rule === "isolate" ? (pa - ps) * qs : (pa - ps) * qa;
      const qtyVar = (qa - qs) * ps;
      const purPriceVar = (pa - ps) * qPur;

      const alerts = [];
      if (Math.abs(pa - ps) > 0 && Math.abs(qa - qs) > 0) alerts.push(t.aJoint);
      if (Math.abs(qPur - qa) > 1e-9) alerts.push(t.aPur);
      addFxAlert(alerts);

      const cards = [
        { label: t.vPrice, val: priceVar },
        { label: t.vQty, val: qtyVar },
        { label: t.vPurPrice, val: purPriceVar }
      ];
      if (rule === "isolate") cards.push({ label: t.vJoint, val: joint });

      paintResults(`${t.tabMat} — ${t.vTotal}`, total, cards, alerts, nature, record);
    }

    function calcLab(record = true) {
      const t = TXT[lang];
      const nature = document.getElementById("natureSel").value;
      const rule = document.getElementById("jointRule").value;
      const ha = parseFloat(document.getElementById("lhAct").value) || 0;
      const hs = parseFloat(document.getElementById("lhStd").value) || 0;
      const ra = parseFloat(document.getElementById("lrAct").value) || 0;
      const rs = parseFloat(document.getElementById("lrStd").value) || 0;

      const total = (ha * ra) - (hs * rs);
      const joint = (ra - rs) * (ha - hs);
      const rateVar = rule === "isolate" ? (ra - rs) * hs : (ra - rs) * ha;
      const timeVar = (ha - hs) * rs;

      const alerts = [];
      if (Math.abs(ra - rs) > 0 && Math.abs(ha - hs) > 0) alerts.push(t.aJoint);
      addFxAlert(alerts);

      const cards = [
        { label: t.vPrice, val: rateVar },
        { label: t.vQty, val: timeVar }
      ];
      if (rule === "isolate") cards.push({ label: t.vJoint, val: joint });

      paintResults(`${t.tabLab} — ${t.vTotal}`, total, cards, alerts, nature, record);
    }

    function calcOvh(record = true) {
      const t = TXT[lang];
      const nature = document.getElementById("natureSel").value;
      const va = parseFloat(document.getElementById("ovVarAct").value) || 0;
      const vb = parseFloat(document.getElementById("ovVarBud").value) || 0;
      const fa = parseFloat(document.getElementById("ovFixAct").value) || 0;
      const fb = parseFloat(document.getElementById("ovFixBud").value) || 0;

      const varDiff = va - vb;
      const fixDiff = fa - fb;
      const total = varDiff + fixDiff;

      const alerts = [];
      addFxAlert(alerts);

      paintResults(`${t.tabOvh} — ${t.vTotal}`, total, [
        { label: t.vVarSpend, val: varDiff },
        { label: t.vFixSpend, val: fixDiff }
      ], alerts, nature, record);
    }

    function calcSls(record = true) {
      const t = TXT[lang];
      const sqAct = parseFloat(document.getElementById("sqAct").value) || 0;
      const sqBud = parseFloat(document.getElementById("sqBud").value) || 0;
      const spAct = parseFloat(document.getElementById("spAct").value) || 0;
      const spBud = parseFloat(document.getElementById("spBud").value) || 0;

      const totalRevVar = (sqAct * spAct) - (sqBud * spBud);
      const priceVar = (spAct - spBud) * sqAct;
      const volVar = (sqAct - sqBud) * spBud;

      const alerts = [];
      addFxAlert(alerts);

      paintResults(`${t.tabSls} — ${t.vTotal}`, totalRevVar, [
        { label: t.vSalesPrice, val: priceVar },
        { label: t.vSalesVol, val: volVar }
      ], alerts, "revenue", record);
    }

    function calcBud(record = true) {
      const t = TXT[lang];
      const nature = document.getElementById("natureSel").value;
      const act = parseFloat(document.getElementById("bAct").value) || 0;
      const fixedBud = parseFloat(document.getElementById("bFixed").value) || 0;
      const actLvl = parseFloat(document.getElementById("bActLvl").value) || 0;
      const planLvl = parseFloat(document.getElementById("bPlanLvl").value) || 1;

      const flexBud = fixedBud * (actLvl / planLvl);
      const totalVar = act - flexBud;
      const volVar = flexBud - fixedBud;

      const alerts = [];
      if (Math.abs(actLvl - planLvl) > 1e-9) alerts.push(t.aAct);
      addFxAlert(alerts);

      paintResults(`${t.tabBud} — ${t.vSpend}`, totalVar, [
        { label: t.vFlexBud, val: flexBud },
        { label: t.vVol, val: volVar }
      ], alerts, nature, record);
    }

    function runActive(record = false) {
      if (sec === "mat") calcMat(record);
      else if (sec === "lab") calcLab(record);
      else if (sec === "ovh") calcOvh(record);
      else if (sec === "sls") calcSls(record);
      else if (sec === "bud") calcBud(record);
    }

    document.querySelectorAll(".pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        sec = btn.dataset.sec;

        document.querySelectorAll(".sec-box").forEach(box => box.style.display = "none");
        document.getElementById(`sec-${sec}`).style.display = "block";

        const hideRes = ["ai", "fixes", "hist"].includes(sec);
        document.getElementById("resultPanel").style.display = hideRes ? "none" : "block";
        if (!hideRes) runActive(false);
      });
    });

    document.getElementById("langSel").addEventListener("change", e => {
      lang = e.target.value;
      setLang();
    });

    ["curSel", "baseCur", "fxRate", "natureSel", "jointRule"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => runActive(false));
      document.getElementById(id).addEventListener("input", () => runActive(false));
    });

    document.getElementById("runMat").addEventListener("click", () => calcMat(true));
    document.getElementById("runLab").addEventListener("click", () => calcLab(true));
    document.getElementById("runOvh").addEventListener("click", () => calcOvh(true));
    document.getElementById("runSls").addEventListener("click", () => calcSls(true));
    document.getElementById("runBud").addEventListener("click", () => calcBud(true));

    document.getElementById("exMat").addEventListener("click", () => {
      document.getElementById("mqAct").value = 115;
      document.getElementById("mqStd").value = 100;
      document.getElementById("mpAct").value = 470;
      document.getElementById("mpStd").value = 500;
      document.getElementById("mqPur").value = 140;
      calcMat(true);
    });

    document.getElementById("exLab").addEventListener("click", () => {
      document.getElementById("lhAct").value = 75;
      document.getElementById("lhStd").value = 80;
      document.getElementById("lrAct").value = 1200;
      document.getElementById("lrStd").value = 1250;
      calcLab(true);
    });

    document.getElementById("exOvh").addEventListener("click", () => {
      document.getElementById("ovVarAct").value = 76000;
      document.getElementById("ovVarBud").value = 80000;
      document.getElementById("ovFixAct").value = 132000;
      document.getElementById("ovFixBud").value = 120000;
      calcOvh(true);
    });

    document.getElementById("exSls").addEventListener("click", () => {
      document.getElementById("sqAct").value = 560;
      document.getElementById("sqBud").value = 500;
      document.getElementById("spAct").value = 2100;
      document.getElementById("spBud").value = 2000;
      calcSls(true);
    });

    document.getElementById("exBud").addEventListener("click", () => {
      document.getElementById("bAct").value = 215000;
      document.getElementById("bFixed").value = 200000;
      document.getElementById("bActLvl").value = 110;
      document.getElementById("bPlanLvl").value = 100;
      calcBud(true);
    });

    document.getElementById("chatForm").addEventListener("submit", e => {
      e.preventDefault();
      handleAiQuestion(document.getElementById("chatInput").value);
    });

    document.getElementById("clearHist").addEventListener("click", () => {
      historyItems = [];
      localStorage.removeItem("va_history_v3");
      renderHistory();
    });

    setLang();
  </script>
</body>
</html>
